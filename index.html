<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Apply a saved theme before first paint to avoid a flash (see src/hooks/useTheme.js) -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme-preference');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {}
      })();
    </script>

    <title>Ragni Chawala — AI, Data &amp; Automation | MSc Artificial Intelligence</title>
    <meta
      name="description"
      content="Portfolio of Ragni Chawala, an MSc Artificial Intelligence student based in Berlin with experience across AI research, frontend engineering, data analysis and workflow automation."
    />

    <meta name="theme-color" content="#0a1322" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
